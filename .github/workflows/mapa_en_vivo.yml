# Actualiza el mapa del tiempo (satélite + lluvia pronosticada) cada 10 minutos y lo publica en GitHub Pages.
# Requisitos (una vez): repo público en GitHub con este código, y en
# Settings > Pages: "Deploy from a branch" -> rama gh-pages, carpeta / (root).
name: Mapa del tiempo en vivo

on:
  schedule:
    - cron: "4-59/10 * * * *"  # cada 10 min (a los :04, :14…); GitHub puede demorar unos minutos
  workflow_dispatch: {}       # botón para correrlo a mano

permissions:
  contents: write
  actions: write     # para volver a lanzarse sola (ver el último paso)

concurrency:
  group: nubosidad
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Anotar la hora de inicio
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # recupera los cuadros ya publicados para sólo procesar los nuevos
      - name: Traer la versión publicada
        run: |
          git fetch origin gh-pages --depth=1 || true
          mkdir -p publicado
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git --work-tree=publicado checkout origin/gh-pages -- .
            git reset -q
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Actualizar imágenes
        run: python mapa_vivo.py --una-vez --salida publicado --cache cache/gfs

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publicado
          publish_branch: gh-pages
          force_orphan: true      # no acumula historial de imágenes
          commit_message: "Nubosidad en vivo"

      # GitHub a veces no dispara el horario (schedule) en repos nuevos o lo atrasa mucho.
      # Por eso cada corrida espera a completar 10 minutos y lanza la siguiente.
      # Para frenar la cadena: Actions > "Mapa del tiempo en vivo" > "..." > Disable workflow.
      - name: Programar la próxima actualización (en 10 minutos)
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          espera=$(( 600 - ($(date +%s) - $INICIO) ))
          [ "$espera" -gt 0 ] && sleep "$espera"
          gh workflow run mapa_en_vivo.yml --repo "$GITHUB_REPOSITORY" --ref main
